name: md_html_pdf
on:
  push:
    branches: [ master ]
    paths:
      - src/**
      - .github/workflows/md_html_pdf.yml
  workflow_dispatch:

jobs:
  md_html_pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker://pandoc/core:2.9
        with:
          args: --standalone -o index.html --css=src/style.css --self-contained src/resume.md

      - run: |
          # wkhtmltopdf is no longer packaged on ubuntu-latest: print the PDF with the runner's preinstalled Chrome
          google-chrome --headless=new --disable-gpu --no-sandbox --no-pdf-header-footer --print-to-pdf=resume.pdf "file://$PWD/index.html"
          test -s resume.pdf
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html resume.pdf
          git commit -m "[CI:deploy] md_html_pdf job"

      - uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}